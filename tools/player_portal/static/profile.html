<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventurer — Legendary FFXI</title>
<style>
  :root {
    --bg:#12151b; --panel:#1a1f28; --panel-2:#0d1015; --line:#2b323d;
    --ink:#e6edf3; --mut:#9aa4b2; --ok:#57c98a;
    --accent:#ecc25f;               /* overridden per-profile from the API */
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; padding:28px 20px; color:var(--ink);
         font-family: ui-sans-serif, "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
         background: radial-gradient(1000px 500px at 50% -10%, #1b212c 0%, var(--bg) 60%);
         display:flex; align-items:flex-start; justify-content:center; }
  .wrap { width:100%; max-width:620px; }
  .nav { display:flex; gap:16px; margin-bottom:14px; font-size:13px; }
  .nav a { color:var(--mut); text-decoration:none; }
  .nav a:hover { color:var(--accent); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:16px; }

  /* header banner tinted by the accent */
  .banner { padding:22px 22px 18px; position:relative;
            background:
              radial-gradient(600px 200px at 15% -40%, color-mix(in srgb, var(--accent) 26%, transparent), transparent),
              linear-gradient(180deg, color-mix(in srgb, var(--accent) 9%, var(--panel)), var(--panel)); }
  .banner::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px;
                   background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.8; }
  .name { font-size:26px; font-weight:800; letter-spacing:.3px; }
  .title { color:var(--accent); font-size:14px; font-weight:600; margin-top:2px; min-height:1px; }
  .role { color:var(--mut); font-size:13px; margin-top:6px; }
  .role b { color:var(--ink); font-weight:600; }

  .body { padding:18px 22px 22px; }
  .feat { display:flex; align-items:center; gap:12px; margin:0 0 16px; padding:12px 14px;
          border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:10px;
          background:color-mix(in srgb, var(--accent) 8%, var(--panel-2)); }
  .feat .medal { width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
                 background:var(--accent); color:#1a1400; font-weight:800; font-size:16px; }
  .feat .ft { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); }
  .feat .fl { font-size:16px; font-weight:700; }

  .sect { font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--mut); margin:18px 0 9px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat { background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:11px 12px; }
  .stat .v { font-size:18px; font-weight:700; } .stat .k { color:var(--mut); font-size:11px; margin-top:2px; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font-size:12px; padding:6px 11px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); }
  .chip.badge { border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); color:var(--accent); }

  .show { display:flex; gap:10px; flex-wrap:wrap; }
  .jcard { flex:1 1 120px; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:12px 14px; }
  .jcard.hi { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .jcard .j { font-weight:800; font-size:16px; } .jcard .l { color:var(--mut); font-size:12px; }
  .jobs { display:flex; flex-wrap:wrap; gap:7px; }
  .jl { font-size:12px; padding:5px 9px; border-radius:7px; background:var(--panel-2); border:1px solid var(--line); }
  .jl b { color:var(--accent); }

  .skeleton { color:var(--mut); text-align:center; padding:40px 0; }
  .foot { font-size:12px; color:var(--mut); text-align:center; }
  .foot a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="/">&#8592; Portal Home</a><a href="/status.html">Server status</a></div>
  <div id="root"><div class="card"><div class="skeleton">Loading adventurer&hellip;</div></div></div>
  <div class="foot">Want your own page like this? <a href="/">Sign in</a> and open <a href="/profile-edit.html">Customize profile</a>.</div>
</div>

<script>
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function n(x){ return Number(x||0).toLocaleString(); }

function nameFromUrl() {
  const parts = location.pathname.split('/').filter(Boolean);
  if (parts[0] === 'c' && parts[1]) return decodeURIComponent(parts[1]);
  return new URLSearchParams(location.search).get('name') || '';
}

async function load() {
  const name = nameFromUrl();
  const root = document.getElementById('root');
  if (!name) { root.innerHTML = card('<div class="skeleton">No character specified.</div>'); return; }
  const res = await fetch('/api/profile/' + encodeURIComponent(name), {credentials:'include'});
  if (res.status === 404) { root.innerHTML = card(`<div class="skeleton">No adventurer named &ldquo;${esc(name)}&rdquo;.</div>`); return; }
  if (!res.ok) { root.innerHTML = card('<div class="skeleton">Could not load this profile.</div>'); return; }
  render(await res.json());
}
function card(inner){ return `<div class="card">${inner}</div>`; }

function render(p) {
  document.documentElement.style.setProperty('--accent', p.accentHex || '#ecc25f');
  document.title = `${p.name} — Legendary FFXI`;

  const sub = p.subJob && p.subJob !== 'NON' ? ` / ${esc(p.subJob)} ${p.subLvl}` : '';
  const showcaseJobs = (p.showcase || []).map(code => (p.jobs || []).find(j => j.job === code)).filter(Boolean);
  const restJobs = (p.jobs || []).filter(j => !(p.showcase || []).includes(j.job));

  let feat = '';
  if (p.featuredLabel) {
    feat = `<div class="feat"><div class="medal">&#9733;</div>
              <div><div class="ft">Featured accomplishment</div><div class="fl">${esc(p.featuredLabel)}</div></div></div>`;
  }

  let showcase = '';
  if (showcaseJobs.length) {
    showcase = `<div class="sect">Showcase</div><div class="show">` +
      showcaseJobs.map(j => `<div class="jcard hi"><div class="j">${esc(j.job)}</div><div class="l">Level ${j.lvl}</div></div>`).join('') +
      `</div>`;
  }

  const badges = (p.badges || []).length
    ? `<div class="sect">Accomplishments</div><div class="chips">${p.badges.map(b => `<span class="chip badge">${esc(b.label)}</span>`).join('')}</div>` : '';

  const prog = [
    p.hlTier ? `<span class="chip">Hunting League T${p.hlTier}</span>` : '',
    p.ascensions ? `<span class="chip">${n(p.ascensions)} Ascensions</span>` : '',
    p.nmKills ? `<span class="chip">${n(p.nmKills)} NM Kills</span>` : '',
    p.rebirthCount ? `<span class="chip">${n(p.rebirthCount)} Rebirths</span>` : '',
  ].filter(Boolean).join('');

  const jobsList = restJobs.length
    ? `<div class="sect">Jobs</div><div class="jobs">${restJobs.map(j => `<span class="jl">${esc(j.job)} <b>${j.lvl}</b></span>`).join('')}</div>` : '';

  document.getElementById('root').innerHTML = card(`
    <div class="banner">
      <div class="name">${esc(p.name)}</div>
      <div class="title">${esc(p.title || '')}</div>
      <div class="role"><b>${esc(p.mainJob)} ${p.mainLvl}</b>${sub} &middot; ${esc(p.nation)} &middot; ${n(p.playtimeH)}h played</div>
    </div>
    <div class="body">
      ${feat}
      <div class="grid">
        <div class="stat"><div class="v">${n(p.hp)}</div><div class="k">HP</div></div>
        <div class="stat"><div class="v">${n(p.mp)}</div><div class="k">MP</div></div>
        <div class="stat"><div class="v">${p.maxedJobs}</div><div class="k">Lv99 Jobs</div></div>
        <div class="stat"><div class="v">${n(p.kills)}</div><div class="k">Enemies Felled</div></div>
        <div class="stat"><div class="v">${n(p.battles)}</div><div class="k">Battles</div></div>
        <div class="stat"><div class="v">${n(p.deaths)}</div><div class="k">Times KO'd</div></div>
      </div>
      ${showcase}
      ${prog ? `<div class="sect">Progression</div><div class="chips">${prog}</div>` : ''}
      ${badges}
      ${jobsList}
    </div>`);
}

load().catch(() => { document.getElementById('root').innerHTML = card('<div class="skeleton">Failed to connect.</div>'); });
</script>
</body>
</html>
