<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12151b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>Your Legend — Legendary FFXI</title>
<style>
  :root{--bg:#12151b;--panel:#1a1f28;--panel-2:#0d1015;--line:#2b323d;--ink:#e6edf3;--mut:#9aa4b2;
        --gold:#ecc25f;--gold-2:#d8ab33;--good:#8fe0b0;--gold-rule:linear-gradient(90deg,transparent,#c79a34 45%,#f3d680 50%,#c79a34 55%,transparent);}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;padding:28px 20px;font-family:ui-sans-serif,"Segoe UI",Roboto,system-ui,sans-serif;
       background:radial-gradient(1200px 600px at 50% -10%,#1b212c 0%,var(--bg) 60%);color:var(--ink);
       display:flex;align-items:flex-start;justify-content:center;}
  .wrap{width:100%;max-width:820px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 22px;}
  .nav{display:flex;gap:16px;margin-bottom:14px;font-size:13px;flex-wrap:wrap;}
  .nav a{color:var(--mut);text-decoration:none;} .nav a:hover,.nav a.on{color:var(--gold);}
  h1{margin:0;font-size:20px;font-weight:700;} h1 .star{color:var(--gold);}
  .sub{color:var(--mut);font-size:13px;margin:4px 0 0;}
  .rule{height:2px;border:0;margin:18px 0;background:var(--gold-rule);}
  select{padding:9px 11px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;}
  .hero{text-align:center;padding:18px 0 6px;}
  .hero .nm{font-size:34px;font-weight:800;font-family:Georgia,serif;} .hero .meta{color:var(--mut);font-size:14px;margin-top:4px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px;}
  .stat{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:16px;opacity:0;transform:translateY(10px);
        transition:opacity .5s,transform .5s;}
  .stat.in{opacity:1;transform:none;}
  .stat .v{font-size:30px;font-weight:800;color:var(--gold);font-family:Georgia,serif;font-variant-numeric:tabular-nums;}
  .stat .v small{font-size:15px;color:var(--gold-2);font-weight:700;margin-left:3px;}
  .stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-top:4px;}
  .stat .note{font-size:12px;color:var(--ink);margin-top:8px;opacity:.85;}
  .empty{color:var(--mut);font-size:14px;text-align:center;padding:30px 0;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;justify-content:center;}
  .btn{font-size:12.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;text-decoration:none;}
  .btn:hover{color:var(--gold);border-color:var(--gold-2);} .btn.gold{color:#241a00;background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:var(--gold-2);font-weight:700;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="nav">
    <a href="/">Home</a><a href="/community.html">Community</a><a href="/achievements.html">Achievements</a>
    <a href="/wrapped.html" class="on">Your Legend</a><a href="/gear-builder.html">Gear</a><a href="/augments.html">Augments</a>
  </div>
  <div class="top">
    <div><h1><span class="star">★</span> Your Legend So Far</h1>
      <p class="sub">A recap of your journey through Vana’diel.</p></div>
    <select id="charSel"></select>
  </div>
  <hr class="rule">
  <div id="body"><div class="empty">Loading…</div></div>
</div></div>

<script src="/pwa.js"></script>
<script>
const $=s=>document.querySelector(s);
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}

async function init(){
  let me;
  try{ me=await fetch('/api/me',{credentials:'include'}).then(r=>{ if(!r.ok) throw 0; return r.json(); }); }
  catch(e){ $('#body').innerHTML='<div class="empty">Please <a class="btn" href="/">sign in</a> to see your recap.</div>'; return; }
  const chars=me.characters||me.chars||[];
  if(!chars.length){ $('#body').innerHTML='<div class="empty">No characters on this account.</div>'; return; }
  $('#charSel').innerHTML=chars.map(c=>`<option value="${c.charid||c.id}">${esc(c.name||c.charname)}</option>`).join('');
  $('#charSel').onchange=()=>show(+$('#charSel').value);
  show(+($('#charSel').value));
}

async function show(charid){
  $('#body').innerHTML='<div class="empty">Tallying your deeds…</div>';
  let d;
  try{ d=await fetch('/api/wrapped/'+charid,{credentials:'include'}).then(r=>{ if(!r.ok) throw 0; return r.json(); }); }
  catch(e){ $('#body').innerHTML='<div class="empty">Could not load this character’s recap.</div>'; return; }
  const cards=(d.cards||[]).map((c,i)=>{
    const val = typeof c.value==='number' ? c.value.toLocaleString() : esc(c.value);
    return `<div class="stat" data-i="${i}"><div class="v">${val}${c.unit?`<small>${esc(c.unit)}</small>`:''}</div>`+
      `<div class="l">${esc(c.label)}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}</div>`;
  }).join('');
  $('#body').innerHTML =
    `<div class="hero"><div class="nm">${esc(d.name)}</div>`+
    `<div class="meta">${esc(d.mainJob)} ${d.mainLvl} · ${esc(d.nation)} · ${d.hours.toLocaleString()}h played</div></div>`+
    `<div class="cards">${cards}</div>`+
    `<div class="actions"><a class="btn gold" href="/c/${encodeURIComponent(d.name)}">View public profile</a>`+
    `<button class="btn" onclick="shareCard('${encodeURIComponent(d.name)}')">Share card</button></div>`;
  // staggered reveal
  const els=[...document.querySelectorAll('.stat')];
  els.forEach((el,i)=>setTimeout(()=>el.classList.add('in'), 90*i+80));
}

function shareCard(name){
  const url=location.origin+'/c/'+name;
  if(navigator.share){ navigator.share({title:'My Legendary FFXI adventurer', url}).catch(()=>{}); }
  else{ navigator.clipboard.writeText(url).then(()=>Legendary&&Legendary.toast('Profile link copied!','win')); }
}
init();
</script>
</body>
</html>
