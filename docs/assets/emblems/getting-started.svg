<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Gateway">
  <defs>
    <linearGradient id="gs-metal" x1="80" y1="32" x2="80" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".16" stop-color="#f3d273"/>
      <stop offset=".44" stop-color="#cf9a2c"/>
      <stop offset=".62" stop-color="#8a6114"/>
      <stop offset=".8" stop-color="#caa03a"/>
      <stop offset="1" stop-color="#6e4a0c"/>
    </linearGradient>
    <radialGradient id="gs-portal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e2fbff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#74d2ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#74d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gs-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffce86"/>
      <stop offset=".4" stop-color="#ff7a1e"/>
      <stop offset=".7" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="gs-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
  </defs>

  <ellipse cx="80" cy="98" rx="40" ry="36" fill="url(#gs-ember)" filter="url(#gs-soft)"/>
  <ellipse cx="80" cy="92" rx="24" ry="42" fill="url(#gs-portal)" filter="url(#gs-soft)"/>

  <!-- Posts -->
  <path fill="#5e4310" transform="translate(0,1.4)" d="M46 122 50 42H56V122Z"/>
  <path fill="#5e4310" transform="translate(0,1.4)" d="M114 122 110 42H104V122Z"/>
  <path fill="url(#gs-metal)" d="M46 122 50 42H56V122Z"/>
  <path fill="url(#gs-metal)" d="M114 122 110 42H104V122Z"/>

  <!-- Nuki (second rail) -->
  <rect x="46" y="56" width="68" height="8" fill="#5e4310" transform="translate(0,1.3)"/>
  <rect x="46" y="56" width="68" height="8" fill="url(#gs-metal)"/>

  <!-- Kasagi (top beam) -->
  <path fill="#5e4310" transform="translate(0,1.4)" d="M30 47Q80 36 130 47L126 40Q80 31 34 40Z"/>
  <path fill="url(#gs-metal)" d="M30 47Q80 36 130 47L126 40Q80 31 34 40Z"/>
  <path fill="none" stroke="#fff7da" stroke-opacity=".5" stroke-width="1" d="M35 40Q80 32 125 40"/>

  <!-- Center plaque -->
  <rect x="73" y="45" width="14" height="13" rx="1.5" fill="#5e4310" transform="translate(0,1.2)"/>
  <rect x="73" y="45" width="14" height="13" rx="1.5" fill="url(#gs-metal)"/>
  <path d="M80 48.5l3 3-3 3-3-3Z" fill="#bdecff" filter="url(#gs-glow)"/>

  <g fill="#ffd081" filter="url(#gs-glow)">
    <circle cx="80" cy="78" r="1.2" opacity=".75"/>
    <circle cx="66" cy="100" r="1.3" opacity=".8"/>
    <circle cx="94" cy="96" r="1.2" opacity=".75"/>
    <circle cx="80" cy="118" r="1.1" opacity=".65"/>
  </g>
</svg>
