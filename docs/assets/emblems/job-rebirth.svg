<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Phoenix rising">
  <defs>
    <linearGradient id="rb-metal" x1="80" y1="22" x2="80" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".16" stop-color="#f7d877"/>
      <stop offset=".36" stop-color="#e0ad2f"/>
      <stop offset=".52" stop-color="#a9761a"/>
      <stop offset=".64" stop-color="#6e4a0c"/>
      <stop offset=".78" stop-color="#caa03a"/>
      <stop offset=".9" stop-color="#f4ce63"/>
      <stop offset="1" stop-color="#7a5410"/>
    </linearGradient>
    <radialGradient id="rb-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe6a0"/>
      <stop offset=".3" stop-color="#ff8a2e"/>
      <stop offset=".64" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="rb-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rb-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
    <path id="rb-wing" d="M80 52 C94 43 112 35 134 34 C126 41 119 47 111 53 C121 51 128 54 132 60 C122 61 113 62 105 66 C113 67 117 72 118 80 C107 71 95 64 84 62 C88 66 89 72 87 79 C82 69 80 60 80 52 Z"/>
    <g id="rb-bird">
      <use href="#rb-wing"/>
      <use href="#rb-wing" transform="matrix(-1,0,0,1,160,0)"/>
      <path d="M80 31 C83 35 85.5 37 85.5 40 C85.5 42.5 84 44.5 82.5 45.5 C84 50 85 56 84 64 C83 74 82 84 80 93 C78 84 77 74 76 64 C75 56 76 50 77.5 45.5 C76 44.5 74.5 42.5 74.5 40 C74.5 37 77 35 80 31 Z"/>
      <path d="M80 93 C85 101 89 109 87 120 C85 113 82 110 80 117 C78 110 75 113 73 120 C71 109 75 101 80 93 Z"/>
    </g>
  </defs>

  <ellipse cx="80" cy="64" rx="46" ry="44" fill="url(#rb-ember)" filter="url(#rb-soft)"/>

  <!-- Radiant burst -->
  <g stroke="#ffd081" stroke-width="1.5" stroke-linecap="round" filter="url(#rb-glow)" stroke-opacity=".55">
    <path d="M80 14V4"/><path d="M110 24l6-7"/><path d="M50 24l-6-7"/>
    <path d="M118 52l9-3"/><path d="M42 52l-9-3"/>
  </g>

  <!-- Phoenix: dark relief, then gold -->
  <use href="#rb-bird" fill="#5e4310" transform="translate(0,1.5)"/>
  <use href="#rb-bird" fill="url(#rb-metal)" filter="url(#rb-glow)"/>

  <!-- Heart ember -->
  <circle cx="80" cy="42" r="4.2" fill="#ffd8a0" filter="url(#rb-glow)"/>
  <circle cx="80" cy="42" r="1.9" fill="#fff3da"/>

  <!-- Sparks -->
  <g fill="#fff2c8" filter="url(#rb-glow)">
    <circle cx="50" cy="70" r="1.5"/><circle cx="110" cy="70" r="1.5"/>
    <circle cx="58" cy="40" r="1.2"/><circle cx="102" cy="40" r="1.2"/>
    <circle cx="80" cy="128" r="1.2" opacity=".8"/>
  </g>
</svg>
