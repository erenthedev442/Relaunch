<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 -4 112 154" role="img" aria-label="Legendary">
  <defs>
    <!-- Indigo shield body -->
    <linearGradient id="lg-body" x1="64" y1="34" x2="64" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d5bd2"/>
      <stop offset=".45" stop-color="#2c39a4"/>
      <stop offset="1" stop-color="#0d1248"/>
    </linearGradient>
    <!-- Polished metal gold (vertical: highlight -> shadow recess -> reflected bounce) -->
    <linearGradient id="lg-metal" x1="64" y1="2" x2="64" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".12" stop-color="#f7d877"/>
      <stop offset=".30" stop-color="#e0ad2f"/>
      <stop offset=".46" stop-color="#b07c19"/>
      <stop offset=".56" stop-color="#6e4a0c"/>
      <stop offset=".68" stop-color="#caa03a"/>
      <stop offset=".82" stop-color="#f4ce63"/>
      <stop offset="1" stop-color="#6b4a0e"/>
    </linearGradient>
    <!-- Diagonal metal for the L -->
    <linearGradient id="lg-metal-l" x1="50" y1="52" x2="82" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffcec"/>
      <stop offset=".26" stop-color="#f3d273"/>
      <stop offset=".55" stop-color="#cf9a2c"/>
      <stop offset=".8" stop-color="#9a6f18"/>
      <stop offset="1" stop-color="#e3b94e"/>
    </linearGradient>
    <!-- Top sheen on the body -->
    <radialGradient id="lg-sheen" cx=".5" cy=".2" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Body vignette to deepen the edges -->
    <radialGradient id="lg-vig" cx=".5" cy=".42" r=".66">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#03061e" stop-opacity=".5"/>
    </radialGradient>
    <!-- Ember aura -->
    <radialGradient id="lg-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset=".28" stop-color="#ff912e"/>
      <stop offset=".6" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <!-- Rune / gem glow -->
    <filter id="f-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft blur for the ember aura -->
    <filter id="f-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.6"/>
    </filter>
    <style><![CDATA[
      @media (prefers-reduced-motion: no-preference) {
        .ember { animation: emberPulse 3.8s ease-in-out infinite;
                 transform-box: fill-box; transform-origin: center; }
      }
      @keyframes emberPulse {
        0%, 100% { opacity: .5;  transform: scale(.95); }
        50%      { opacity: .92; transform: scale(1.05); }
      }
    ]]></style>
  </defs>

  <!-- Ember aura behind everything -->
  <ellipse class="ember" cx="64" cy="88" rx="46" ry="54" fill="url(#lg-ember)" filter="url(#f-soft)"/>

  <!-- Crown -->
  <path d="M37 32 44 9 56 21 64 2 72 21 84 9 91 32Z" fill="#5e4310" transform="translate(0,1.4)"/>
  <path d="M37 32 44 9 56 21 64 2 72 21 84 9 91 32Z" fill="url(#lg-metal)"/>
  <rect x="37.5" y="28.5" width="53" height="8" rx="2.4" fill="#5e4310" transform="translate(0,1.3)"/>
  <rect x="37.5" y="28.5" width="53" height="8" rx="2.4" fill="url(#lg-metal)"/>
  <path d="M37 32 44 9 56 21 64 2 72 21 84 9 91 32" fill="none" stroke="#fff8df" stroke-opacity=".55" stroke-width="1"/>
  <circle cx="44" cy="9" r="3.1" fill="url(#lg-metal)"/>
  <circle cx="64" cy="2.6" r="3.6" fill="url(#lg-metal)"/>
  <circle cx="84" cy="9" r="3.1" fill="url(#lg-metal)"/>
  <!-- Crown gem -->
  <path d="M64 28 l4.4 4.4 -4.4 4.4 -4.4 -4.4Z" fill="#bdecff" filter="url(#f-glow)"/>
  <path d="M64 29.8 l2.5 2.6 -2.5 2.6 -2.5 -2.6Z" fill="#eaf9ff"/>

  <!-- Shield -->
  <path fill="#5e4310" d="M19 33H109V78C109 107 88 129 64 140 40 129 19 107 19 78Z" transform="translate(0,1.4)"/>
  <path fill="url(#lg-metal)" d="M20 34H108V78C108 107 87 129 64 139 41 129 20 107 20 78Z"/>
  <path fill="url(#lg-body)" d="M27 41H101V78C101 102 84 121 64 131 44 121 27 102 27 78Z"/>
  <path fill="url(#lg-sheen)" d="M27 41H101V78C101 102 84 121 64 131 44 121 27 102 27 78Z"/>
  <path fill="url(#lg-vig)" d="M27 41H101V78C101 102 84 121 64 131 44 121 27 102 27 78Z"/>
  <!-- Inner border -->
  <path fill="none" stroke="url(#lg-metal)" stroke-width="1.7" d="M33 47H95V77C95 99 80 116 64 124 48 116 33 99 33 77Z"/>
  <!-- Top rim highlight -->
  <path fill="none" stroke="#fff7da" stroke-opacity=".5" stroke-width="1" d="M22 36H106"/>

  <!-- Glowing arcane runes etched across the lower shield.
       Mirror-symmetric about x=64 so the eye reads an engraved sigil band, not left-to-right text. -->
  <g fill="none" stroke="#9fe6ff" stroke-opacity=".9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#f-glow)">
    <path d="M50 105v9 M50 107.5l3.4 2"/>
    <path d="M57 106v9 M57 108l3 2 M57 110.5l3 2"/>
    <path d="M64 118v-11 M64 110l-3.4-3 M64 110l3.4-3"/>
    <path d="M71 106v9 M71 108l-3 2 M71 110.5l-3 2"/>
    <path d="M78 105v9 M78 107.5l-3.4 2"/>
  </g>

  <!-- L -->
  <path fill="#5e4310" transform="translate(0,1.3)" d="M47 54H71V60H66V90H88V100H47V94H52V60H47Z"/>
  <path fill="url(#lg-metal-l)" stroke="#7a5414" stroke-width=".5"
        d="M47 54H71V60H66V90H88V100H47V94H52V60H47Z"/>
  <path fill="none" stroke="#fff7da" stroke-opacity=".5" stroke-width=".8" d="M48 55H70"/>

  <!-- Rising ember sparks -->
  <g fill="#ffd081" filter="url(#f-glow)">
    <circle cx="52" cy="137" r="1.1" opacity=".8"/>
    <circle cx="61" cy="143" r="1.5" opacity=".9"/>
    <circle cx="69" cy="139" r=".9" opacity=".72"/>
    <circle cx="77" cy="134" r="1.3" opacity=".82"/>
    <circle cx="64" cy="148" r="1" opacity=".62"/>
    <circle cx="17" cy="92" r="1.1" opacity=".55"/>
    <circle cx="111" cy="85" r="1" opacity=".5"/>
  </g>
</svg>
