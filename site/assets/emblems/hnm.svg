<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="King's crown">
  <defs>
    <linearGradient id="hk-metal" x1="80" y1="22" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".14" stop-color="#f7d877"/>
      <stop offset=".34" stop-color="#e0ad2f"/>
      <stop offset=".5" stop-color="#a9761a"/>
      <stop offset=".6" stop-color="#6e4a0c"/>
      <stop offset=".72" stop-color="#caa03a"/>
      <stop offset=".86" stop-color="#f4ce63"/>
      <stop offset="1" stop-color="#7a5410"/>
    </linearGradient>
    <radialGradient id="hk-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffce86"/>
      <stop offset=".34" stop-color="#ff7a1e"/>
      <stop offset=".66" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="hk-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hk-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
  </defs>

  <ellipse cx="80" cy="68" rx="44" ry="44" fill="url(#hk-ember)" filter="url(#hk-soft)"/>

  <!-- Behemoth horns flanking the crown -->
  <path fill="#5e4310" d="M118 88C131 84 139 73 141 57 137 75 130 86 121 95Z" transform="translate(0,1.3)"/>
  <path fill="#5e4310" d="M42 88C29 84 21 73 19 57 23 75 30 86 39 95Z" transform="translate(0,1.3)"/>
  <path fill="url(#hk-metal)" d="M118 88C131 84 139 73 141 57 137 75 130 86 121 95Z"/>
  <path fill="url(#hk-metal)" d="M42 88C29 84 21 73 19 57 23 75 30 86 39 95Z"/>

  <!-- Crown points -->
  <path fill="#5e4310" transform="translate(0,1.4)" d="M38 84 44 50 53 68 62 42 71 66 80 30 89 66 98 42 107 68 116 50 122 84Z"/>
  <path fill="url(#hk-metal)" d="M38 84 44 50 53 68 62 42 71 66 80 30 89 66 98 42 107 68 116 50 122 84Z"/>

  <!-- Band -->
  <rect x="36" y="82" width="88" height="17" rx="3.2" fill="#5e4310" transform="translate(0,1.3)"/>
  <rect x="36" y="82" width="88" height="17" rx="3.2" fill="url(#hk-metal)"/>
  <path fill="none" stroke="#fff7da" stroke-opacity=".5" stroke-width="1" d="M39 84H121"/>

  <!-- Finial orbs -->
  <g fill="url(#hk-metal)" stroke="#7a5414" stroke-width=".4">
    <circle cx="44" cy="50" r="3.6"/><circle cx="62" cy="42" r="3.2"/>
    <circle cx="98" cy="42" r="3.2"/><circle cx="116" cy="50" r="3.6"/>
  </g>

  <!-- Crown gem -->
  <path d="M80 23l4.6 5-4.6 5-4.6-5Z" fill="#bdecff" filter="url(#hk-glow)"/>
  <path d="M80 25.4l2.6 2.6-2.6 2.6-2.6-2.6Z" fill="#eaf9ff"/>

  <!-- Band jewels -->
  <ellipse cx="80" cy="90.5" rx="5" ry="4.2" fill="#e0480c" filter="url(#hk-glow)"/>
  <ellipse cx="78.4" cy="89" rx="1.5" ry="1.2" fill="#ffd0a0"/>
  <circle cx="58" cy="90.5" r="2.6" fill="#9fe6ff"/>
  <circle cx="102" cy="90.5" r="2.6" fill="#9fe6ff"/>
  <circle cx="47" cy="90.5" r="1.8" fill="#bdecff"/>
  <circle cx="113" cy="90.5" r="1.8" fill="#bdecff"/>

  <g fill="#ffd081" filter="url(#hk-glow)">
    <circle cx="50" cy="104" r="1.3" opacity=".8"/>
    <circle cx="110" cy="104" r="1.3" opacity=".8"/>
    <circle cx="80" cy="110" r="1.1" opacity=".7"/>
  </g>
</svg>
