<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Forge hammer">
  <defs>
    <linearGradient id="rf-metal" x1="60" y1="66" x2="108" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffcec"/>
      <stop offset=".28" stop-color="#f3d273"/>
      <stop offset=".56" stop-color="#cf9a2c"/>
      <stop offset=".8" stop-color="#8f6614"/>
      <stop offset="1" stop-color="#e3b94e"/>
    </linearGradient>
    <radialGradient id="rf-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe6a0"/>
      <stop offset=".3" stop-color="#ff8a2e"/>
      <stop offset=".64" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="rf-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rf-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <ellipse cx="74" cy="100" rx="44" ry="40" fill="url(#rf-ember)" filter="url(#rf-soft)"/>

  <!-- Glowing ingot -->
  <rect x="48" y="116" width="36" height="6" rx="1.5" fill="#1a1330"/>
  <path fill="url(#rf-ember)" d="M52 110 82 110 86 116 48 116Z"/>
  <path fill="#ffdf9a" d="M55 111H79L81 114H53Z" opacity=".9"/>

  <!-- Hammer handle -->
  <path d="M88 89 60 41" stroke="#3a2a12" stroke-width="7" stroke-linecap="round" fill="none"/>
  <g stroke="#caa03a" stroke-width="1.1" stroke-opacity=".85" stroke-linecap="round">
    <path d="M66.5 51 71.5 54"/><path d="M63.5 46 68.5 49"/>
  </g>
  <path d="M84 83 92 78" stroke="#e6c25a" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Hammer head -->
  <path fill="#4a3209" transform="translate(.6,1.4)" d="M99.1 72.2 108.1 88 76.9 105.8 67.9 90.2Z"/>
  <path fill="url(#rf-metal)" d="M99.1 72.2 108.1 88 76.9 105.8 67.9 90.2Z"/>
  <path fill="#fff7da" fill-opacity=".5" d="M67.9 90.2 76.9 105.8 73.6 107.7 64.6 92.1Z"/>
  <path fill="none" stroke="#7a5414" stroke-opacity=".5" stroke-width=".8" d="M99.1 72.2 108.1 88"/>

  <!-- Spark burst -->
  <g stroke="#bfe9ff" stroke-width="1.6" stroke-linecap="round" filter="url(#rf-glow)" fill="none" stroke-opacity=".95">
    <path d="M70 100 64 86"/><path d="M70 100 54 92"/><path d="M70 100 80 88"/><path d="M70 100 52 104"/>
  </g>
  <g fill="#fff2c8" filter="url(#rf-glow)">
    <circle cx="62" cy="82" r="1.7"/><circle cx="48" cy="90" r="1.4"/>
    <circle cx="84" cy="84" r="1.5"/><circle cx="44" cy="102" r="1.3"/>
    <circle cx="58" cy="74" r="1.1"/><circle cx="90" cy="96" r="1.2"/>
  </g>
</svg>
