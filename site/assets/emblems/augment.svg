<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Augment gem">
  <defs>
    <radialGradient id="ag-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffce86"/>
      <stop offset=".34" stop-color="#ff7a1e"/>
      <stop offset=".66" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="ag-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ag-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
  </defs>

  <ellipse cx="80" cy="72" rx="42" ry="44" fill="url(#ag-ember)" filter="url(#ag-soft)"/>

  <!-- Faceted gem (light from upper-left) -->
  <g stroke="#eaf9ff" stroke-width=".7" stroke-linejoin="round">
    <path fill="#dff5ff" d="M80 42 63 53 80 62Z"/>
    <path fill="#c2ebff" d="M80 42 80 62 97 53Z"/>
    <path fill="#7ec8f5" d="M63 53 60 70 80 62Z"/>
    <path fill="#5aa8e8" d="M97 53 80 62 100 70Z"/>
    <path fill="#3f86dc" d="M60 70 80 107 80 62Z"/>
    <path fill="#2a63c2" d="M80 62 80 107 100 70Z"/>
  </g>
  <path fill="none" stroke="#bfe6ff" stroke-width="1.4" stroke-linejoin="round" filter="url(#ag-glow)" d="M80 42 97 53 100 70 80 107 60 70 63 53Z"/>
  <!-- Table sparkle -->
  <path fill="#ffffff" filter="url(#ag-glow)" d="M75 51l1.4 3.2 3.2 1.4-3.2 1.4-1.4 3.2-1.4-3.2-3.2-1.4 3.2-1.4Z"/>

  <!-- Arcane runes orbiting the gem -->
  <g fill="none" stroke="#9fe6ff" stroke-opacity=".9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#ag-glow)">
    <path d="M80 22v9 M80 25l-3.2-2.8 M80 25l3.2-2.8"/>
    <path d="M40 78v9 M40 80.5l3.4 2"/>
    <path d="M120 78v9 M120 80.5l-3.4 2"/>
    <path d="M52 104l3 8 3-8"/>
    <path d="M102 104l3 8 3-8"/>
  </g>

  <g fill="#ffd081" filter="url(#ag-glow)">
    <circle cx="64" cy="116" r="1.3" opacity=".8"/>
    <circle cx="96" cy="116" r="1.3" opacity=".8"/>
    <circle cx="80" cy="122" r="1.1" opacity=".7"/>
  </g>
</svg>
