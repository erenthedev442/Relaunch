<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Anvil and coins">
  <defs>
    <linearGradient id="gv-metal" x1="80" y1="60" x2="80" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".16" stop-color="#f3d273"/>
      <stop offset=".44" stop-color="#cf9a2c"/>
      <stop offset=".6" stop-color="#8a6114"/>
      <stop offset=".8" stop-color="#caa03a"/>
      <stop offset="1" stop-color="#6e4a0c"/>
    </linearGradient>
    <linearGradient id="gv-coin" x1="104" y1="92" x2="104" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset=".5" stop-color="#e6b53c"/>
      <stop offset="1" stop-color="#9a6f18"/>
    </linearGradient>
    <radialGradient id="gv-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffce86"/>
      <stop offset=".34" stop-color="#ff7a1e"/>
      <stop offset=".66" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="gv-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gv-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
  </defs>

  <ellipse cx="74" cy="84" rx="44" ry="42" fill="url(#gv-ember)" filter="url(#gv-soft)"/>

  <!-- Anvil -->
  <g transform="translate(0,1.4)" fill="#4a3209">
    <path d="M30 75 50 68 112 68 112 83 50 83Z"/>
    <path d="M68 83 92 83 88 95 72 95Z"/>
    <path d="M56 95 104 95 110 105 50 105Z"/>
  </g>
  <path fill="url(#gv-metal)" d="M30 75 50 68 112 68 112 83 50 83Z"/>
  <path fill="url(#gv-metal)" d="M68 83 92 83 88 95 72 95Z"/>
  <path fill="url(#gv-metal)" d="M56 95 104 95 110 105 50 105Z"/>
  <path fill="none" stroke="#fff7da" stroke-opacity=".55" stroke-width="1" d="M51 70H110"/>

  <!-- Gil coins -->
  <g stroke="#6e4a0c" stroke-width=".5">
    <ellipse cx="104" cy="111" rx="15" ry="4.4" fill="#b9881f"/>
    <path fill="#b9881f" d="M89 106.5V111a15 4.4 0 0 0 30 0V106.5Z"/>
    <ellipse cx="104" cy="106.5" rx="15" ry="4.4" fill="url(#gv-coin)"/>
    <path fill="#c79528" d="M89 102V106.5a15 4.4 0 0 0 30 0V102Z"/>
    <ellipse cx="104" cy="102" rx="15" ry="4.6" fill="url(#gv-coin)" filter="url(#gv-glow)"/>
  </g>
  <ellipse cx="104" cy="102" rx="10.5" ry="2.9" fill="none" stroke="#8a6114" stroke-opacity=".6" stroke-width=".8"/>
  <path d="M104 99l2.6 2.9-2.6 2.9-2.6-2.9Z" fill="#fff3c8"/>

  <g fill="#ffd081" filter="url(#gv-glow)">
    <circle cx="58" cy="92" r="1.3" opacity=".8"/>
    <circle cx="120" cy="88" r="1.2" opacity=".7"/>
    <circle cx="70" cy="60" r="1.1" opacity=".7"/>
  </g>
</svg>
