<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Dungeon gate">
  <defs>
    <linearGradient id="dg-metal" x1="80" y1="6" x2="80" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".12" stop-color="#f7d877"/>
      <stop offset=".30" stop-color="#e0ad2f"/>
      <stop offset=".46" stop-color="#b07c19"/>
      <stop offset=".56" stop-color="#6e4a0c"/>
      <stop offset=".68" stop-color="#caa03a"/>
      <stop offset=".82" stop-color="#f4ce63"/>
      <stop offset="1" stop-color="#6b4a0e"/>
    </linearGradient>
    <linearGradient id="dg-body" x1="80" y1="20" x2="80" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a47b8"/>
      <stop offset=".5" stop-color="#1a2270"/>
      <stop offset="1" stop-color="#070a30"/>
    </linearGradient>
    <radialGradient id="dg-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset=".3" stop-color="#ff8a2e"/>
      <stop offset=".62" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="dg-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dg-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="dg-open">
      <path d="M42 146V58C42 38 58 26 80 23 102 26 118 38 118 58V146Z"/>
    </clipPath>
  </defs>

  <!-- Gold arch frame -->
  <path fill="#5e4310" d="M25 147V56C25 27 49 12 80 8 111 12 135 27 135 56V147Z" transform="translate(0,1.4)"/>
  <path fill="url(#dg-metal)" d="M25 147V56C25 27 49 12 80 8 111 12 135 27 135 56V147Z"/>
  <!-- Indigo opening -->
  <path fill="url(#dg-body)" d="M42 147V58C42 38 58 26 80 23 102 26 118 38 118 58V147Z"/>

  <!-- Lair glow + portcullis, clipped to the opening -->
  <g clip-path="url(#dg-open)">
    <ellipse cx="80" cy="116" rx="40" ry="44" fill="url(#dg-ember)" filter="url(#dg-soft)"/>
    <g fill="url(#dg-metal)" stroke="#7a5414" stroke-width=".5">
      <path d="M50.5 34H55.5V126L53 133 50.5 126Z"/>
      <path d="M64 34H69V126L66.5 133 64 126Z"/>
      <path d="M77.5 34H82.5V126L80 133 77.5 126Z"/>
      <path d="M91 34H96V126L93.5 133 91 126Z"/>
      <path d="M104.5 34H109.5V126L107 133 104.5 126Z"/>
      <rect x="46" y="45" width="68" height="5"/>
      <rect x="44" y="92" width="72" height="5"/>
    </g>
  </g>

  <!-- Frame inner edge highlight -->
  <path fill="none" stroke="#fff7da" stroke-opacity=".5" stroke-width="1" d="M42 60C42 40 58 28 80 25 102 28 118 40 118 60"/>

  <!-- Keystone gem -->
  <path d="M80 12l6.5 6.5-6.5 6.5-6.5-6.5Z" fill="#bdecff" filter="url(#dg-glow)"/>
  <path d="M80 14.2l3.7 3.8-3.7 3.8-3.7-3.8Z" fill="#eaf9ff"/>

  <!-- Rising embers -->
  <g fill="#ffd081" filter="url(#dg-glow)">
    <circle cx="62" cy="128" r="1.3" opacity=".85"/>
    <circle cx="98" cy="124" r="1.5" opacity=".9"/>
    <circle cx="80" cy="138" r="1.1" opacity=".7"/>
    <circle cx="73" cy="120" r=".9" opacity=".7"/>
  </g>
</svg>
