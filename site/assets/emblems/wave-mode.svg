<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Wave survival">
  <defs>
    <linearGradient id="wm-metal" x1="80" y1="14" x2="80" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".16" stop-color="#f7d877"/>
      <stop offset=".4" stop-color="#e0ad2f"/>
      <stop offset=".56" stop-color="#9a6c16"/>
      <stop offset=".7" stop-color="#caa03a"/>
      <stop offset=".86" stop-color="#f4ce63"/>
      <stop offset="1" stop-color="#7a5410"/>
    </linearGradient>
    <linearGradient id="wm-wave" x1="80" y1="92" x2="80" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d5bd2"/>
      <stop offset=".6" stop-color="#27338f"/>
      <stop offset="1" stop-color="#0c1248"/>
    </linearGradient>
    <radialGradient id="wm-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffce86"/>
      <stop offset=".34" stop-color="#ff7a1e"/>
      <stop offset=".66" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="wm-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wm-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <ellipse cx="80" cy="92" rx="40" ry="40" fill="url(#wm-ember)" filter="url(#wm-soft)"/>

  <!-- Cresting waves -->
  <g stroke="#0c1248" stroke-width=".6">
    <path fill="url(#wm-wave)" d="M30 124C27 106 40 94 57 99 68 102 69 113 61 116 67 111 61 104 53 105 44 106 42 116 47 124Z"/>
    <path fill="url(#wm-wave)" d="M130 124C133 106 120 94 103 99 92 102 91 113 99 116 93 111 99 104 107 105 116 106 118 116 113 124Z"/>
  </g>
  <g fill="none" stroke="#bfe9ff" stroke-opacity=".8" stroke-width="1.5" stroke-linecap="round" filter="url(#wm-glow)">
    <path d="M34 121C32 108 41 99 54 102"/>
    <path d="M126 121C128 108 119 99 106 102"/>
  </g>
  <g fill="#eaf9ff"><circle cx="57" cy="100" r="1.6"/><circle cx="103" cy="100" r="1.6"/></g>

  <!-- Sword -->
  <path fill="#5e4310" transform="translate(0,1.3)" d="M80 17 84.5 40 83 85 77 85 75.5 40Z"/>
  <path fill="url(#wm-metal)" d="M80 17 84.5 40 83 85 77 85 75.5 40Z"/>
  <path fill="none" stroke="#6e4a0c" stroke-opacity=".55" stroke-width="1.1" d="M80 24V82"/>
  <path fill="none" stroke="#fff7da" stroke-opacity=".6" stroke-width=".8" d="M78.4 30 79.4 78"/>

  <!-- Guard -->
  <path fill="#5e4310" transform="translate(0,1.3)" d="M55 86Q80 81 105 86L105 93Q80 88 55 93Z"/>
  <path fill="url(#wm-metal)" d="M55 86Q80 81 105 86L105 93Q80 88 55 93Z"/>

  <!-- Grip + pommel -->
  <rect x="76" y="92" width="8" height="15" rx="2.4" fill="#2a1d4a"/>
  <g stroke="#caa03a" stroke-width="1" stroke-opacity=".8"><path d="M76.5 96H83.5"/><path d="M76.5 99.5H83.5"/><path d="M76.5 103H83.5"/></g>
  <circle cx="80" cy="111" r="4.2" fill="#bdecff" filter="url(#wm-glow)"/>
  <circle cx="78.6" cy="109.6" r="1.3" fill="#fff"/>

  <g fill="#ffd081" filter="url(#wm-glow)">
    <circle cx="80" cy="80" r="1.2" opacity=".7"/>
    <circle cx="68" cy="118" r="1.2" opacity=".75"/>
    <circle cx="92" cy="118" r="1.2" opacity=".75"/>
  </g>
</svg>
