<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 150" role="img" aria-label="Arcane eye">
  <defs>
    <linearGradient id="sg-metal" x1="80" y1="32" x2="80" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".18" stop-color="#f3d273"/>
      <stop offset=".5" stop-color="#cf9a2c"/>
      <stop offset=".72" stop-color="#8a6114"/>
      <stop offset=".9" stop-color="#e6c25a"/>
      <stop offset="1" stop-color="#7a5410"/>
    </linearGradient>
    <radialGradient id="sg-iris" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eafbff"/>
      <stop offset=".35" stop-color="#7fd4ff"/>
      <stop offset=".75" stop-color="#2f8fe0"/>
      <stop offset="1" stop-color="#16407e"/>
    </radialGradient>
    <radialGradient id="sg-ember" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffce86"/>
      <stop offset=".34" stop-color="#ff7a1e"/>
      <stop offset=".66" stop-color="#e0480c"/>
      <stop offset="1" stop-color="#e0480c" stop-opacity="0"/>
    </radialGradient>
    <filter id="sg-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.2"/></filter>
  </defs>

  <ellipse cx="80" cy="72" rx="42" ry="44" fill="url(#sg-ember)" filter="url(#sg-soft)"/>

  <!-- Arcane ring -->
  <circle cx="80" cy="72" r="37" fill="none" stroke="#4a3209" stroke-width="6.5"/>
  <circle cx="80" cy="72" r="37" fill="none" stroke="url(#sg-metal)" stroke-width="5"/>
  <circle cx="80" cy="72" r="40" fill="none" stroke="#fff7da" stroke-opacity=".4" stroke-width=".8"/>

  <!-- Runes + ticks around the ring -->
  <g fill="none" stroke="#9fe6ff" stroke-opacity=".92" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#sg-glow)">
    <path d="M80 30v8 M80 32.4l-2.6-2.4 M80 32.4l2.6-2.4"/>
    <path d="M80 114v-8 M80 111.6l-2.6 2.4 M80 111.6l2.6 2.4"/>
    <path d="M38 72h8 M40.4 72l-2.4-2.6 M40.4 72l-2.4 2.6"/>
    <path d="M122 72h-8 M119.6 72l2.4-2.6 M119.6 72l2.4 2.6"/>
  </g>
  <g fill="#bfe6ff" filter="url(#sg-glow)">
    <circle cx="106" cy="46" r="1.5"/><circle cx="54" cy="46" r="1.5"/>
    <circle cx="106" cy="98" r="1.5"/><circle cx="54" cy="98" r="1.5"/>
  </g>

  <!-- Eye -->
  <path fill="#0a1030" stroke="url(#sg-metal)" stroke-width="2" d="M50 72Q80 53 110 72Q80 91 50 72Z"/>
  <circle cx="80" cy="72" r="13.5" fill="url(#sg-iris)"/>
  <g stroke="#173b73" stroke-width=".8" stroke-opacity=".7">
    <path d="M80 60V84M68 72H92M71.5 63.5 88.5 80.5M88.5 63.5 71.5 80.5"/>
  </g>
  <circle cx="80" cy="72" r="5.6" fill="#05102a"/>
  <circle cx="77.6" cy="69.4" r="1.8" fill="#eafbff"/>
  <path fill="#fff7da" fill-opacity=".5" d="M54 71Q80 56 106 71Q80 62 54 71Z"/>

  <g fill="#ffd081" filter="url(#sg-glow)">
    <circle cx="62" cy="116" r="1.3" opacity=".8"/>
    <circle cx="98" cy="116" r="1.3" opacity=".8"/>
  </g>
</svg>
