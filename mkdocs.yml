site_name: Legendary FFXI
site_description: Player guide and reference for Legendary — an extreme QoL, fast-progression FFXI private server
site_url: https://legendary-ffxi.pages.dev/
repo_url: https://github.com/richardknutzjr/FFXI-Private-Server-FJB
repo_name: Source

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

# Per-character profile pages live under docs/community/players/<slug>.md
# and are auto-generated by tools/docgen/generators/player_profiles.py.
# Listing each one in `nav:` below would be insane (and stale within a
# day), so we let MkDocs find them without nav entries. `info` keeps the
# build output clean while still surfacing genuine orphans as a notice
# rather than a --strict failure.
validation:
  nav:
    omitted_files: info
    absolute_links: info
    not_found: warn

# Dev/admin-only pages: kept in the repo for maintainers but not published.
exclude_docs: |
  admin/gear-coverage/
  admin/missing-spells.md
  admin/unfeatured-systems.md

extra_css:
  - assets/item-tooltip.css
  - assets/branding.css
  - assets/status.css
  - assets/gear-finder.css
  - assets/item-search.css
  - assets/leaderboards.css

extra_javascript:
  - assets/item-tooltip.js
  - assets/status.js
  - assets/gear-finder.js
  - assets/item-search.js
  - assets/leaderboards.js
  - assets/milestone-grid.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

