site_name: FJB Relaunch
site_description: Player guide for the FJB Relaunch server
site_url: https://fjb-relaunch.pages.dev/

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

validation:
  nav:
    omitted_files: info
    absolute_links: info
    not_found: warn

exclude_docs: |
  admin/gear-coverage/
  admin/missing-spells.md
  admin/unfeatured-systems.md
  admin/module-ownership.md

extra_css:
  - assets/item-tooltip.css
  - assets/branding.css
  - assets/status.css
  - assets/gear-finder.css
  - assets/item-search.css
  - assets/leaderboards.css
  - assets/gear-vendors.css

extra_javascript:
  - assets/item-tooltip.js
  - assets/status.js
  - assets/gear-finder.js
  - assets/item-search.js
  - assets/leaderboards.js
  - assets/milestone-grid.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

